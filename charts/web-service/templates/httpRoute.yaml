{{- if .Values.httproute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- range .Values.httproute.parentRefs }}
    - name: {{ .name }}
      kind: {{ .kind }}
      {{- if .namespace }}
      namespace: {{ .namespace }}
      {{- end }}
    {{- end }}
  
  hostnames:
    {{- range .Values.httproute.hostnames }}
    - "{{ . }}"
    {{- end }}
  
  rules:
    {{- range .Values.httproute.rules }}
    - backendRefs:
        {{- range .backendRefs }}
        - group: {{ .group }}
          kind: {{ .kind }}
          name: {{ .name }}
          port: {{ .port }}
          weight: {{ .weight | default 1 }}
        {{- end }}
      matches:
        {{- range .matches }}
        - path:
            type: {{ .path.type }}
            value: {{ .path.value }}
        {{- end }}
      {{- if .Values.httproute.securityPolicyRefs.enabled }}
      securityPolicyRefs:
        {{- range .Values.httproute.securityPolicyRefs.policies }}
        - name: {{ .name }}
          {{- if .namespace }}
          namespace: {{ .namespace }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
