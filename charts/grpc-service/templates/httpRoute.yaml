{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "grpc-service.fullname" . }}
  labels:
    {{- include "grpc-service.labels" . | nindent 4 }}
spec:
  {{- with .Values.httpRoute.parentRefs }}
  parentRefs:
    {{- range . }}
    - name: {{ .name }}
      kind: {{ .kind }}
      {{- with .namespace }}
      namespace: {{ . }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- with .Values.httpRoute.rules }}
  rules:
    {{- range . }}
    -
      {{- with .matches }}
      matches:
        {{- range . }}
        -
          {{- with .path }}
          path:
            type: {{ .type }}
            value: {{ .value | quote }}
          {{- end }}
          {{- with .headers }}
          headers:
            {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with .queryParams }}
          queryParams:
            {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with .method }}
          method: {{ . }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- with .backendRefs }}
      backendRefs:
        {{- range . }}
        - group: {{ .group | default "" | quote }}
          kind: {{ .kind | default "Service" | quote }}
          name: {{ .name | default (include "grpc-service.fullname" $) }}
          port: {{ .port | default $.Values.http.port }}
          weight: {{ .weight | default 1 }}
        {{- end }}
      {{- end }}
      {{- with .filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .retry }}
      retry:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .sessionPersistence }}
      sessionPersistence:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
